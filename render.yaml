# Render Blueprint for the API (the web app deploys to Vercel).
# Secrets are marked sync: false and set in the Render dashboard.
services:
  - type: web
    name: fleet-billing-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /health
    # Apply pending migrations, then start. Uses DIRECT_URL (session pooler).
    dockerCommand: sh -c "node_modules/.bin/prisma migrate deploy && node dist/main.js"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: WEB_URL
        sync: false
