name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Placeholders only: CI never talks to the real Supabase or Stripe.
env:
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
  NEXT_PUBLIC_API_URL: http://localhost:4000

jobs:
  checks:
    name: Lint · typecheck · unit/e2e (API)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Vitest (pricing, webhook, HTTP e2e)
        run: pnpm --filter @fleet/api test
      - name: Migrations + RLS + seed apply cleanly on plain Postgres
        run: |
          pnpm --filter @fleet/api db:migrate
          pnpm --filter @fleet/api db:seed

  web:
    name: Build · Playwright (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fleet/api build
      - run: pnpm --filter @fleet/web build
      - run: pnpm --filter @fleet/web exec playwright install --with-deps chromium
      - run: pnpm --filter @fleet/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Docker images + compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build and start the compose stack (placeholder secrets)
        env:
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          SUPABASE_URL: https://placeholder.supabase.co
        run: |
          docker compose up --build --detach --wait --wait-timeout 180 api web
          curl --fail --silent http://localhost:4000/health
          curl --fail --silent --output /dev/null http://localhost:3000/en
          curl --fail --silent "http://localhost:4000/plans/quote?period=TERM&children=2" | grep -q '"totalCents":60800'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
